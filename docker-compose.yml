version: '3.8'

services:

  # 1. Настраиваем базу данных PostgreSQL
  db:
    image: postgres:15
    container_name: cramhub_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Joker1
      POSTGRES_DB: cramhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Настраиваем наш Python-бэкенд (собирается из Dockerfile)
  backend:
    build: .
    container_name: cramhub_backend
    restart: always
    environment:
      # Бэкенд будет стучаться в контейнер db по этому URL
      - DATABASE_URL=postgresql://postgres:Joker1@db:5432/cramhub
      - SECRET_KEY=1234
    ports:
      - "8000:8000"
    depends_on:
      - db

  # 3. Настраиваем веб-сервер Nginx для фронтенда (HTML/CSS/JS)
  frontend:
    image: nginx:alpine
    container_name: cramhub_frontend
    restart: always
    ports:
      - "80:80"  # Открываем стандартный порт для сайтов в интернете
    volumes:
      # Пробрасываем папку frontend внутрь Nginx
      - ./frontend:/usr/share/nginx/html
      # Пробрасываем файл настроек Nginx (тот самый, что открыт у тебя в Canvas)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

# Определяем тома для сохранения данных
volumes:
  postgres_data: