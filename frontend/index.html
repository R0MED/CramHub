<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Коллекции – CramHub</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <h1 class="logo">CramHub</h1>
        <div class="topbar-right">
          <span id="user-info" class="user-info"></span>
          <a href="statistics.html" class="btn btn-ghost" style="margin-right: 10px;">Статистика</a>
          <button id="logout-btn" class="btn btn-ghost">Выйти</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="page-head">
        <h2 class="page-title">Мои коллекции</h2>
        <button id="new-collection-btn" class="btn btn-primary">
          + Новая коллекция
        </button>
      </div>

      <div style="display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; align-items: center;">
        <div style="display: flex; gap: 5px; background: #f1f5f9; padding: 4px; border-radius: 8px;">
          <button id="tab-my" class="btn btn-primary" style="margin: 0;">Мои наборы</button>
          <button id="tab-public" class="btn btn-ghost" style="margin: 0; color: #475569;">Публичные</button>
        </div>
        <input
          type="text"
          id="search-input"
          placeholder="🔍 Поиск по названию или описанию..."
          style="flex-grow: 1; padding: 10px 15px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; font-family: inherit; font-size: 14px;"
        />
      </div>
      <div id="error" class="error-banner"></div>

      <div id="collections" class="collections-grid">
        <p class="muted">Загрузка…</p>
      </div>
    </main>

    <div id="modal" class="modal-overlay">
      <div class="modal">
        <h3 class="modal-title">Новая коллекция</h3>
        <div id="modal-error" class="error-banner"></div>
        <label for="collection-title">Название</label>
        <input
          type="text"
          id="collection-title"
          placeholder="Например: Английские слова"
        />
        <label for="collection-description">Описание (необязательно)</label>
        <textarea
          id="collection-description"
          rows="3"
          placeholder="Короткое описание"
        ></textarea>
        
        <label style="display: flex; align-items: center; gap: 10px; margin-top: 15px; cursor: pointer; font-weight: normal;">
          <input type="checkbox" id="collection-public" style="width: 16px; height: 16px;" />
          <span style="color: #475569;">Сделать доступной для всех (Публичная)</span>
        </label>
        <div class="modal-actions" style="margin-top: 20px;">
          <button id="modal-cancel" class="btn btn-ghost">Отмена</button>
          <button id="modal-save" class="btn btn-primary">Создать</button>
        </div>
      </div>
    </div>

    <script src="js/api.js?v=777"></script>
    <script src="js/collections.js?v=777"></script>
  </body>
</html>
