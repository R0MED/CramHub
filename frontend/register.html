<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация – CramHub</title>
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <div class="auth-card">
      <h1 class="auth-title">CramHub</h1>
      <p class="auth-subtitle">Создание аккаунта</p>

      <div id="error" class="auth-error"></div>

      <form id="register-form">
        <label for="username">Имя пользователя</label>
        <input
          type="text"
          id="username"
          placeholder="ivan"
          autocomplete="username"
          required
        />

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />

        <label for="password">Пароль</label>
        <input
          type="password"
          id="password"
          placeholder="••••••••"
          autocomplete="new-password"
          required
        />

        <button type="submit" class="auth-btn">Зарегистрироваться</button>
      </form>

      <p class="auth-switch">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </p>
    </div>

    <script src="js/api.js?v=777"></script>
    <script src="js/auth.js?v=777"></script>
  </body>
</html>
