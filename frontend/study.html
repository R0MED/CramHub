<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Обучение – CramHub</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/study.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a href="index.html" class="logo">CramHub</a>
        <div class="topbar-right">
          <span id="user-info" class="user-info"></span>
          <button id="logout-btn" class="btn btn-ghost">Выйти</button>
        </div>
      </div>
    </header>

    <main class="container study-container">
      <a id="back-link" href="#" class="back-link">← К карточкам</a>

      <div id="error" class="error-banner"></div>

      <div id="study-area">
        <div id="progress" class="study-progress"></div>

        <div id="flashcard" class="flashcard">
          <div class="flashcard-inner">
            <div class="flashcard-face flashcard-front">
              <span class="flashcard-label">Вопрос</span>
              <p id="card-front"></p>
            </div>
            <div class="flashcard-face flashcard-back">
              <span class="flashcard-label">Ответ</span>
              <p id="card-back"></p>
            </div>
          </div>
        </div>

        <p class="study-hint">
          Нажмите на карточку или пробел, чтобы перевернуть.
        </p>

        <!-- Стандартные кнопки (до переворота) -->
        <div class="study-controls" id="basic-controls">
          <button id="flip-btn" class="btn btn-primary">Показать ответ</button>
        </div>

        <!-- НОВЫЙ БЛОК: Кнопки оценки SM-2 (появляются после переворота) -->
        <div class="study-controls" id="sm2-controls" style="display: none; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px;">
          <p style="width: 100%; text-align: center; margin-bottom: 5px; color: #666; font-size: 0.9rem;">Насколько хорошо вы помните это?</p>
          <button class="btn rate-btn" data-quality="0" style="background-color: #ffebee; color: #c62828; border-color: #ffcdd2;">Забыл (0)</button>
          <button class="btn rate-btn" data-quality="1" style="background-color: #fff3e0; color: #ef6c00; border-color: #ffe0b2;">Трудно (1)</button>
          <button class="btn rate-btn" data-quality="2" style="background-color: #fff8e1; color: #f9a825; border-color: #ffecb3;">Сложно (2)</button>
          <button class="btn rate-btn" data-quality="3" style="background-color: #e3f2fd; color: #1565c0; border-color: #bbdefb;">Норм (3)</button>
          <button class="btn rate-btn" data-quality="4" style="background-color: #e8f5e9; color: #2e7d32; border-color: #c8e6c9;">Легко (4)</button>
          <button class="btn rate-btn" data-quality="5" style="background-color: #e0f2f1; color: #00695c; border-color: #b2dfdb;">Идеал (5)</button>
        </div>
      </div>

      <!-- Экран завершения -->
      <div id="empty-state" class="empty-state" style="display: none">
        <h2>🎉 Отличная работа!</h2>
        <p class="muted mt-2">На сегодня карточек для повторения в этой коллекции больше нет.</p>
        <br>
        <a href="index.html" class="btn btn-primary">Вернуться на главную</a>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/study.js"></script>
  </body>
</html>
